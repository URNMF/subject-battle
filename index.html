    <script>
        // Supabase 設定 (依使用者提供之真實資料)
        const SUPABASE_URL = 'https://jfgjbkaacnhsnmuxkzfs.supabase.co';
        const SUPABASE_PUBLISHABLE_KEY = 'sb_publishable_w2dnA-k2dzK8pR9MG8k-nw_y6TAe2UD';
        const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);

        // 全局狀態管理
        let nickname = '';
        let clientToken = '';
        let currentRoomId = null;
        let currentSeat = null; // 1 (房主) 或 2 (加入者)
        let lobbyChannel = null;
        let gameChannel = null;
        let gameStateChannel = null;
        let heartbeatTimer = null;
        let disconnectTimer = null;
        let opponentWasPresent = false;
        
        let currentCorrectAns = null;
        let meAvatar = '';
        let opAvatar = '';

        const ANIMALS = ['🐱','🐶','🐻','🐼','🐧','🤡','🥸','👽','💩','🦒','🐒'];

        // 初始化
        window.onload = () => {
            initToken();
            checkDbConnection();
        };

        function initToken() {
            clientToken = localStorage.getItem('sequence_battle_client_token');
            if (!clientToken) {
                clientToken = 'client_' + Math.random().toString(36).substring(2, 15) + '_' + Date.now();
                localStorage.setItem('sequence_battle_client_token', clientToken);
            }
        }

        async function checkDbConnection() {
            try {
                // 嘗試抓取任意資料來測試連線
                const { error } = await supabase.from('rooms').select('id').limit(1);
                const statusEl = document.getElementById('db-status');
                if (error) throw error;
                statusEl.innerText = '資料庫已連接';
                statusEl.style.color = '#4CAF50';
            } catch (err) {
                document.getElementById('db-status').innerText = '資料庫連線失敗，請檢查網路';
                document.getElementById('db-status').style.color = '#F44336';
            }
        }

        // 畫面切換
        function switchScreen(screenId) {
            document.querySelectorAll('.screen').forEach(el => el.classList.remove('active'));
            document.getElementById(screenId).classList.add('active');
        }

        function goToHome() {
            cleanupRoomState();
            switchScreen('screen-home');
        }

        // 進入大廳
        function goToLobby() {
            const input = document.getElementById('input-nickname').value.trim();
            if (!input) {
                alert('請輸入暱稱！');
                return;
            }
            if (input.length > 20) {
                alert('暱稱請在20個字以內！');
                return;
            }
            nickname = input;
            document.getElementById('lobby-greeting').innerText = `你好，${nickname}！準備好接受挑戰了嗎？`;
            
            switchScreen('screen-lobby');
            subscribeLobby();
            fetchLiveRooms();
        }

        // 清理所有房間狀態與計時器
        function cleanupRoomState() {
            if (heartbeatTimer) clearInterval(heartbeatTimer);
            if (disconnectTimer) clearTimeout(disconnectTimer);
            if (gameChannel) { supabase.removeChannel(gameChannel); gameChannel = null; }
            if (gameStateChannel) { supabase.removeChannel(gameStateChannel); gameStateChannel = null; }
            
            heartbeatTimer = null;
            disconnectTimer = null;
            currentRoomId = null;
            currentSeat = null;
            opponentWasPresent = false;
        }

        function returnToLobby() {
            cleanupRoomState();
            switchScreen('screen-lobby');
            fetchLiveRooms();
        }

        // 大廳功能：取得與監聽房間
        async function fetchLiveRooms() {
            try {
                const { data, error } = await supabase.rpc('list_live_rooms');
                if (error) throw error;
                renderRoomList(data || []);
            } catch (err) {
                console.error('Error fetching rooms:', err);
            }
        }

        function renderRoomList(rooms) {
            const list = document.getElementById('room-list');
            list.innerHTML = '';
            if (rooms.length === 0) {
                list.innerHTML = '<div style="color:#888; text-align:center; padding: 20px;">目前沒有等待中的房間，自己建立一個吧！</div>';
                return;
            }
            rooms.forEach(room => {
                // 不顯示自己建立的房間 (理論上自己應該在 waiting 畫面，但防呆)
                if (room.host_token === clientToken) return;

                const item = document.createElement('div');
                item.className = 'room-item';
                item.innerHTML = `
                    <span>房主: <strong>${room.host_nickname || '未知玩家'}</strong></span>
                    <button class="btn join-btn" onclick="tryJoinRoom('${room.id}', '${room.host_nickname}')">加入對戰</button>
                `;
                list.appendChild(item);
            });
        }

        function subscribeLobby() {
            if (lobbyChannel) return; // 已訂閱
            lobbyChannel = supabase.channel('public:rooms')
                .on('postgres_changes', { event: '*', schema: 'public', table: 'rooms' }, payload => {
                    // 當房間有變化時，自動重新整理大廳
                    if (document.getElementById('screen-lobby').classList.contains('active')) {
                        fetchLiveRooms();
                    }
                })
                .subscribe();
        }

        // 建立房間
        async function createRoom() {
            try {
                const { data, error } = await supabase.rpc('create_room', {
                    p_nickname: nickname,
                    p_client_token: clientToken
                });
                
                if (error) throw error;
                
                // RPC 可能回傳單一 ID 或物件，依據實作情況處理
                currentRoomId = (typeof data === 'object' && data !== null) ? data.id : data;
                currentSeat = 1;
                
                assignAvatars();
                document.getElementById('waiting-avatar').innerText = meAvatar;
                
                switchScreen('screen-waiting');
                
                setupHostProbeListener();
                
                // 開始 heartbeat (每 3 秒)
                heartbeatTimer = setInterval(async () => {
                    if (currentSeat === 1 && document.getElementById('screen-waiting').classList.contains('active')) {
                        await supabase.rpc('heartbeat_room', {
                            p_room_id: currentRoomId,
                            p_client_token: clientToken
                        });
                    }
                }, 3000);

                // 監聽 game_state 狀態改變，若變成 playing 代表有人加入
                setupGameStateListener();
                
            } catch (err) {
                alert('建立房間失敗：' + (err.message || 'NetworkError'));
            }
        }

        // 房主在等待時，監聽探測 (Probe)
        function setupHostProbeListener() {
            if (gameChannel) supabase.removeChannel(gameChannel);
            gameChannel = supabase.channel(`game-${currentRoomId}`);
            
            gameChannel.on('broadcast', { event: 'join_probe' }, (payload) => {
                // 收到探測，回傳 ACK
                if (payload.payload && payload.payload.probe_id) {
                    gameChannel.send({
                        type: 'broadcast',
                        event: 'host_ack',
                        payload: { probe_id: payload.payload.probe_id }
                    });
                }
            }).subscribe();
        }

        // 加入前探測 (Join Probe)
        async function tryJoinRoom(roomId, hostName) {
            currentRoomId = roomId;
            currentSeat = 2;
            const probeId = 'probe_' + Date.now();
            
            // 建立暫時的探測頻道
            if (gameChannel) supabase.removeChannel(gameChannel);
            gameChannel = supabase.channel(`game-${currentRoomId}`);
            
            let ackReceived = false;
            
            // 監聽房主回覆
            gameChannel.on('broadcast', { event: 'host_ack' }, (payload) => {
                if (payload.payload && payload.payload.probe_id === probeId) {
                    ackReceived = true;
                }
            }).subscribe(async (status) => {
                if (status === 'SUBSCRIBED') {
                    // 發送探測
                    gameChannel.send({
                        type: 'broadcast',
                        event: 'join_probe',
                        payload: { probe_id: probeId }
                    });
                }
            });

            // 等待 2000ms
            setTimeout(async () => {
                if (ackReceived) {
                    // 收到房主回應，正式呼叫 join_room
                    executeJoinRoom();
                } else {
                    // 未收到回應
                    alert('房主已離開，請選其他房間。');
                    cleanupRoomState();
                    fetchLiveRooms(); // 刷新
                }
            }, 2000);
        }

        async function executeJoinRoom() {
            try {
                const { data, error } = await supabase.rpc('join_room', {
                    p_room_id: currentRoomId,
                    p_nickname: nickname,
                    p_client_token: clientToken
                });
                
                if (error) {
                    if (error.message.includes('full') || error.message.includes('ROOM_ALREADY_FULL')) {
                        alert('房間已滿，請選擇其他房間。');
                    } else if (error.message.includes('not found') || error.message.includes('ROOM_NOT_FOUND')) {
                        alert('找不到房間，可能已取消。');
                    } else {
                        alert('加入失敗：' + error.message);
                    }
                    cleanupRoomState();
                    fetchLiveRooms();
                    return;
                }
                
                // 加入成功
                assignAvatars();
                setupGameStateListener();
                startBattle();
                
            } catch (err) {
                alert('網路錯誤，請稍後再試。');
                cleanupRoomState();
            }
        }

        // 取消房間 (房主)
        async function cancelRoom() {
            if (!currentRoomId) return;
            try {
                await supabase.rpc('cancel_room', {
                    p_room_id: currentRoomId,
                    p_client_token: clientToken
                });
            } catch(e) { console.error(e); }
            returnToLobby();
        }

        // pagehide 防護
        window.addEventListener('pagehide', () => {
            if (currentSeat === 1 && currentRoomId && document.getElementById('screen-waiting').classList.contains('active')) {
                // 嘗試同步發送取消
                const body = JSON.stringify({ p_room_id: currentRoomId, p_client_token: clientToken });
                // 使用 fetch keepalive 替代 supabase client 以確保在關閉時送出 (URL須配合RPC endpoint，此處簡單忽略，因為已有10秒斷線機制)
            }
        });

        // 根據 roomId 產生固定角色
        function assignAvatars() {
            if (!currentRoomId) return;
            let hash = 0;
            for (let i = 0; i < currentRoomId.length; i++) {
                hash = currentRoomId.charCodeAt(i) + ((hash << 5) - hash);
            }
            hash = Math.abs(hash);
            const index1 = hash % ANIMALS.length;
            let index2 = (hash >> 1) % ANIMALS.length;
            if (index1 === index2) index2 = (index2 + 1) % ANIMALS.length;
            
            if (currentSeat === 1) {
                meAvatar = ANIMALS[index1];
                opAvatar = ANIMALS[index2];
            } else {
                meAvatar = ANIMALS[index2];
                opAvatar = ANIMALS[index1];
            }
        }

        // 監聽 game_state 即時變更
        function setupGameStateListener() {
            if (gameStateChannel) supabase.removeChannel(gameStateChannel);
            gameStateChannel = supabase.channel(`game_state_${currentRoomId}`)
                .on('postgres_changes', { 
                    event: 'UPDATE', 
                    schema: 'public', 
                    table: 'game_state',
                    filter: `room_id=eq.${currentRoomId}`
                }, payload => {
                    handleGameStateUpdate(payload.new);
                })
                .subscribe();
        }

        function handleGameStateUpdate(state) {
            // 如果原本在 waiting，收到 playing 則進入對戰
            if (state.status === 'playing' && document.getElementById('screen-waiting').classList.contains('active')) {
                if(heartbeatTimer) { clearInterval(heartbeatTimer); heartbeatTimer = null; }
                startBattle();
            }
            
            if (document.getElementById('screen-battle').classList.contains('active')) {
                // 更新雙方 HP
                const myHp = currentSeat === 1 ? state.player1_hp : state.player2_hp;
                const opHp = currentSeat === 1 ? state.player2_hp : state.player1_hp;
                
                const myHpEl = document.getElementById('hud-me-hp');
                const opHpEl = document.getElementById('hud-op-hp');
                
                // 動畫效果：若對手 HP 減少，我方命中對手，對手搖晃
                if (parseInt(opHpEl.innerText) > opHp) {
                    document.querySelector('.player-info.opponent').classList.remove('shake');
                    void document.querySelector('.player-info.opponent').offsetWidth;
                    document.querySelector('.player-info.opponent').classList.add('shake');
                }
                // 若我方 HP 減少，我方搖晃
                if (parseInt(myHpEl.innerText) > myHp) {
                    document.querySelector('.player-info.me').classList.remove('shake');
                    void document.querySelector('.player-info.me').offsetWidth;
                    document.querySelector('.player-info.me').classList.add('shake');
                }

                myHpEl.innerText = myHp;
                opHpEl.innerText = opHp;
                
                // 檢查是否結束
                if (state.status === 'finished') {
                    endGame(state.winner_seat);
                }

        // 開始對戰設定
        function startBattle() {
            switchScreen('screen-battle');
            
            // 設定 HUD
            document.getElementById('hud-me-name').innerText = nickname;
            document.getElementById('hud-me-avatar').innerText = meAvatar;
            document.getElementById('hud-me-hp').innerText = '7';
            
            // 對手名稱暫時用「對手」，等待 Presence 帶入
            document.getElementById('hud-op-name').innerText = '對手連線中...';
            document.getElementById('hud-op-avatar').innerText = opAvatar;
            document.getElementById('hud-op-hp').innerText = '7';
            
            setupPresence();
            generateNewQuestion();
        }

        // Presence 機制
        function setupPresence() {
            if (gameChannel) supabase.removeChannel(gameChannel);
            gameChannel = supabase.channel(`game-${currentRoomId}`, {
                config: { presence: { key: clientToken } }
            });
            
            gameChannel.on('presence', { event: 'sync' }, () => {
                const state = gameChannel.presenceState();
                let opponentFound = false;
                
                for (const key in state) {
                    if (key !== clientToken) {
                        opponentFound = true;
                        opponentWasPresent = true;
                        // 更新對手名稱
                        if (state[key][0] && state[key][0].nickname) {
                            document.getElementById('hud-op-name').innerText = state[key][0].nickname;
                        }
                    }
                }
                
                // 斷線判定 (必須曾經看見過對手)
                if (opponentWasPresent && !opponentFound) {
                    if (!disconnectTimer && !document.getElementById('screen-result').classList.contains('active')) {
                        disconnectTimer = setTimeout(() => {
                            if (document.getElementById('screen-battle').classList.contains('active')) {
                                alert('對手已斷線！');
                                returnToLobby();
                            }
                        }, 5000);
                    }
                } else {
                    if (disconnectTimer) {
                        clearTimeout(disconnectTimer);
                        disconnectTimer = null;
                    }
                }
            });
            
            gameChannel.subscribe(async (status) => {
                if (status === 'SUBSCRIBED') {
                    await gameChannel.track({
                        seat: currentSeat,
                        nickname: nickname
                    });
                }
            });
        }

        // 題目產生邏輯 (七年級數學：整數加減)
        function generateNewQuestion() {
            // 產生非零整數 -99 ~ 99
            const getNum = () => {
                let n = 0;
                while(n === 0) n = Math.floor(Math.random() * 199) - 99;
                return n;
            };
            
            let num1 = getNum();
            let num2 = getNum();
            const isAdd = Math.random() > 0.5;
            
            // 避免算太久，數字大小稍微控制
            if (Math.abs(num1) > 50 && Math.abs(num2) > 50) {
                num2 = Math.floor(num2 / 2);
            }

            const op = isAdd ? '+' : '-';
            const ans = isAdd ? (num1 + num2) : (num1 - num2);
            
            // 格式化，負數在後面要加括號
            const formatNum = (n, isFirst) => (n < 0 && !isFirst) ? `(${n})` : `${n}`;
            const qText = `${formatNum(num1, true)} ${op} ${formatNum(num2, false)} = ?`;
            
            // 產生選項
            let options = [ans];
            while (options.length < 4) {
                let fake;
                const randChoice = Math.random();
                if (randChoice < 0.3) {
                    fake = -ans; // 變號錯誤
                } else if (randChoice < 0.6) {
                    fake = isAdd ? (num1 - num2) : (num1 + num2); // 運算符號看錯
                } else {
                    fake = ans + (Math.floor(Math.random() * 21) - 10); // 隨機偏差
                }
                
                if (fake === 0 && ans !== 0) fake = ans + 2; // 微調
                if (!options.includes(fake)) {
                    options.push(fake);
                }
            }
            
            // 洗牌
            options.sort(() => Math.random() - 0.5);
            currentCorrectAns = ans;
            
            // 渲染
            document.getElementById('question-text').innerText = qText;
            const container = document.getElementById('options-container');
            container.innerHTML = '';
            
            options.forEach(opt => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.innerText = opt;
                btn.onclick = () => submitAnswer(opt);
                container.appendChild(btn);
            });
        }

        // 答題處理
        async function submitAnswer(selectedVal) {
            // 防止連點，暫時禁用所有按鈕
            document.querySelectorAll('.option-btn').forEach(b => b.disabled = true);
            
            const isCorrect = (selectedVal === currentCorrectAns);
            showToast(isCorrect);
            
            try {
                // 呼叫 RPC，讓後端更新分數與 HP
                await supabase.rpc('resolve_answer', {
                    p_room_id: currentRoomId,
                    p_client_token: clientToken,
                    p_is_correct: isCorrect
                });
            } catch (err) {
                console.error("Answer submit error:", err);
            }
            
            // 無論對錯，短暫延遲後換下一題
            setTimeout(() => {
                if (document.getElementById('screen-battle').classList.contains('active')) {
                    generateNewQuestion();
                }
            }, 600);
        }

        function showToast(isCorrect) {
            const toast = document.getElementById('msg-toast');
            toast.innerText = isCorrect ? '答對！' : '差一點，再試一次！';
            toast.className = 'msg-toast ' + (isCorrect ? 'toast-correct' : 'toast-wrong');
            toast.style.opacity = '1';
            
            if (isCorrect) {
                document.body.style.backgroundColor = '#E8F5E9';
            } else {
                document.body.style.backgroundColor = '#FFEBEE';
            }
            
            setTimeout(() => {
                toast.style.opacity = '0';
                document.body.style.backgroundColor = 'var(--bg)';
            }, 500);
        }

        // 結束遊戲
        function endGame(winnerSeat) {
            if(disconnectTimer) clearTimeout(disconnectTimer);
            
            const iAmWinner = (winnerSeat === currentSeat);
            
            document.getElementById('result-title').innerText = iAmWinner ? '🎉 勝利！ 🎉' : '再接再厲！';
            document.getElementById('result-title').style.color = iAmWinner ? 'var(--primary)' : '#666';
            document.getElementById('result-avatar').innerText = meAvatar;
            document.getElementById('result-msg').innerText = iAmWinner ? '太棒了，你擊敗了對手！' : '這次可惜了，下次一定能贏！';
            
            switchScreen('screen-result');
        }

    </script>
</body>
</html>
